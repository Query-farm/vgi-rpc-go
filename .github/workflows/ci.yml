name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Language-local Go tests only — intermediary helpers, client-side
      # code, unexported internals, pure functions. Cross-language behaviour
      # is the conformance job's remit; see CLAUDE.md § Testing Policy.
      # These ran nowhere in CI until they were wired in here.
      - name: Go unit tests
        run: go test ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      # Checks the docs against the code: module paths resolve, complete
      # examples compile, symbol references exist, relative links resolve.
      - name: Verify documentation
        run: go run ./tools/docverify

  conformance:
    needs: lint
    runs-on: ubuntu-latest
    env:
      GOCOVERDIR: ${{ github.workspace }}/_covdata
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build conformance worker with coverage
        run: go build -cover -covermode=atomic -o conformance-worker ./conformance/cmd/vgi-rpc-conformance-go

      # The Go worker tracks the *unreleased* Python reference (the TCP
      # transport — tcp_connect / --tcp — lands on main ahead of PyPI), so
      # install vgi_rpc from source off the default branch rather than
      # `pip install vgi-rpc`. external extras (aiohttp etc.) are required by
      # the externalize-always HTTP conformance variant; the host
      # conformance_describe fixture (test_go_conformance.py) runs __describe__
      # against the real Go worker across every transport.
      - name: Clone vgi-rpc-python reference
        run: git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git "$RUNNER_TEMP/vgi-rpc-python"

      # The conformance extra pulls jsonschema, which `vgi-rpc-test
      # --access-log` needs to validate records against access_log.schema.json.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${RUNNER_TEMP}/vgi-rpc-python[http,cli,external,conformance]" pytest pytest-timeout

      - name: Create coverage directory
        run: mkdir -p _covdata

      - name: Run conformance tests
        run: timeout 120 python -m pytest test_go_conformance.py -x -v

      # The runner-driven conformance suite, with no access log attached.
      #
      # This is a different suite from the pytest step above, not a duplicate:
      # `_pytest_suite.py` carries no `large_payload` tests at all (its only
      # matching names are TestExternalLocation's externalisation cases), so
      # the whole `large_payload` category is reachable ONLY through
      # `vgi-rpc-test`. Until this step existed the sole `vgi-rpc-test`
      # invocation in this workflow was the access-log one below, which is the
      # one place the >2 GiB test must not run — so it would have run nowhere.
      #
      # `large_payload.echo_binary_over_int32_max` is required as of vgi-rpc
      # 0.42.0 (it was opt-in behind VGI_RPC_CONFORMANCE_HUGE before), and it
      # is the only test reaching the size where a single write(2)/send(2)
      # stops accepting a whole buffer. It allocates >2 GiB on each side.
      # The timeout is 600s against the reference's own 300s budget for that
      # test: the old `timeout 120` would kill a perfectly healthy run.
      - name: Run conformance suite (large payloads included)
        run: timeout 600 vgi-rpc-test --cmd "$PWD/conformance-worker"

      # Access-log conformance was verified by hand for months and drifted
      # anyway — four people checked it by inspection and the rule was still
      # wrong. It runs here now so it cannot silently rot again.
      #
      # --access-log-debug is not optional: at INFO the worker omits
      # `request_data`, and a log that never carries the field trivially
      # satisfies every rule that governs it, so the whole payload contract
      # goes unchecked. --require-request-data makes that absence a failure.
      #
      # The only --filter here is the >2 GiB payload, and it is an exclusion of
      # size, not of coverage: at --access-log-debug the emitter base64s the
      # whole re-serialized request batch into `request_data`, so this one test
      # would write a single ~2.9 GB JSONL line and then ask Python to
      # jsonschema-validate it. Measured factor: a 4 MiB payload already yields
      # a 5,593,736-byte record (5,593,068 base64 chars), and it scales
      # linearly. The test itself still runs — in the step above, where no
      # access log is attached. This step's job is the log's *shape*, which a
      # 4 MiB payload exercises exactly as well as a 2 GiB one.
      #
      # Nothing else is filtered: the suite's zero-parameter methods (void*)
      # send an empty schema and no row, and they are the exact case a
      # row-demanding validator gets wrong (v0.36.1 shipped that bug). Do not
      # add a filter that excludes them.
      - name: Verify access log against the spec
        run: |
          timeout 120 vgi-rpc-test \
            --cmd "$PWD/conformance-worker --access-log $RUNNER_TEMP/access-log.jsonl --access-log-debug" \
            --access-log "$RUNNER_TEMP/access-log.jsonl" \
            --require-request-data \
            --filter '!large_payload.echo_binary_over_int32_max'

      - name: Merge coverage profiles
        run: go tool covdata textfmt -i=_covdata -o=coverage-go.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-go.txt
          flags: go
          fail_ci_if_error: false
