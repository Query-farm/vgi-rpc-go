name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Language-local Go tests only — intermediary helpers, client-side
      # code, unexported internals, pure functions. Cross-language behaviour
      # is the conformance job's remit; see CLAUDE.md § Testing Policy.
      # These ran nowhere in CI until they were wired in here.
      - name: Go unit tests
        run: go test ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      # Checks the docs against the code: module paths resolve, complete
      # examples compile, symbol references exist, relative links resolve.
      - name: Verify documentation
        run: go run ./tools/docverify

  conformance:
    needs: lint
    runs-on: ubuntu-latest
    env:
      GOCOVERDIR: ${{ github.workspace }}/_covdata
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build conformance worker with coverage
        run: go build -cover -covermode=atomic -o conformance-worker ./conformance/cmd/vgi-rpc-conformance-go

      # The Go worker tracks the *unreleased* Python reference (the TCP
      # transport — tcp_connect / --tcp — lands on main ahead of PyPI), so
      # install vgi_rpc from source off the default branch rather than
      # `pip install vgi-rpc`. external extras (aiohttp etc.) are required by
      # the externalize-always HTTP conformance variant; the host
      # conformance_describe fixture (test_go_conformance.py) runs __describe__
      # against the real Go worker across every transport.
      - name: Clone vgi-rpc-python reference
        run: git clone --depth 1 https://github.com/Query-farm/vgi-rpc-python.git "$RUNNER_TEMP/vgi-rpc-python"

      # The conformance extra pulls jsonschema, which `vgi-rpc-test
      # --access-log` needs to validate records against access_log.schema.json.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "${RUNNER_TEMP}/vgi-rpc-python[http,cli,external,conformance]" pytest pytest-timeout

      - name: Create coverage directory
        run: mkdir -p _covdata

      - name: Run conformance tests
        run: timeout 120 python -m pytest test_go_conformance.py -x -v

      # Access-log conformance was verified by hand for months and drifted
      # anyway — four people checked it by inspection and the rule was still
      # wrong. It runs here now so it cannot silently rot again.
      #
      # --access-log-debug is not optional: at INFO the worker omits
      # `request_data`, and a log that never carries the field trivially
      # satisfies every rule that governs it, so the whole payload contract
      # goes unchecked. --require-request-data makes that absence a failure.
      #
      # No --filter: the suite's zero-parameter methods (void*) send an empty
      # schema and no row, and they are the exact case a row-demanding
      # validator gets wrong (v0.36.1 shipped that bug). Do not add a filter
      # that excludes them.
      - name: Verify access log against the spec
        run: |
          timeout 120 vgi-rpc-test \
            --cmd "$PWD/conformance-worker --access-log $RUNNER_TEMP/access-log.jsonl --access-log-debug" \
            --access-log "$RUNNER_TEMP/access-log.jsonl" \
            --require-request-data

      - name: Merge coverage profiles
        run: go tool covdata textfmt -i=_covdata -o=coverage-go.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage-go.txt
          flags: go
          fail_ci_if_error: false
